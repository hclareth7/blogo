apiVersion: apps/v1
kind: Deployment
metadata:
  name: blogo
  labels:
    app.kubernetes.io/component: server
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: blogo
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/component: server
    spec:
      imagePullSecrets:
        - name: blogo-pull-secret
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        # UIDs omitted: OpenShift SCC restricted-v2 assigns from namespace range
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: blogo
          image: quay.io/hclareth/blogo:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: BLOGO_PORT
              value: "8080"
            - name: BLOGO_FETCH_ON_START
              value: "true"
            - name: BLOGO_LOG_LEVEL
              value: "info"
            - name: BLOGO_LOG_FORMAT
              value: "json"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: content
              mountPath: /content
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: content
          emptyDir: {}
        - name: tmp
          emptyDir: {}
